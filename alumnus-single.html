<style>
:root{
  --bg:#0A0A0A;--card:#121212;--panel:#181818;--text:#F5F5F3;--muted:#8E8E93;--dim:#5A5A5E;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.15);
  --serif:"Cormorant Garamond",Georgia,serif;--sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:300 15px/1.6 var(--sans);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:1px solid #fff;outline-offset:3px}
::selection{background:#fff;color:#000}

header{display:flex;justify-content:center;padding:1.25rem 1.5rem;border-bottom:1px solid var(--line)}
.brand{font-size:.72rem;letter-spacing:.45em;text-transform:uppercase;font-weight:300;padding-left:.45em}
.brand:hover{opacity:.7}

main{flex:1;padding:1.25rem clamp(1rem,2vw,2rem);display:flex}
.tiles{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(1rem,1.5vw,1.5rem);min-height:600px;height:calc(100vh - 140px)}
.tile{display:flex;flex-direction:column;background:var(--card);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:4px;overflow:hidden;cursor:pointer;text-align:left}
.tile-bar{display:flex;justify-content:space-between;align-items:center;padding:.55rem .75rem;border-bottom:1px solid var(--line)}
.dots{display:flex;gap:6px;align-items:center}
.dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.25);transition:background .3s,transform .3s}
.dot.on{background:#fff;transform:scale(1.25)}
.tile-label{font:400 9px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:#6b6b6f}
.view{position:relative;flex:1;overflow:hidden;border-radius:0 0 7px 7px;background:#1a1a1a}
.view img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1s ease,transform .9s cubic-bezier(.16,1,.3,1),filter .6s}
.view img.on{opacity:1}
.tile:hover .view img{transform:scale(1.05);filter:brightness(1.05)}
.overlay{position:absolute;inset:0;display:flex;align-items:flex-end;padding:clamp(1.25rem,2.2vw,2rem);background:linear-gradient(to top,rgba(0,0,0,.9),rgba(0,0,0,.2) 50%,transparent);transition:background .5s}
.tile:hover .overlay{background:linear-gradient(to top,rgba(0,0,0,1),rgba(0,0,0,.25) 55%,transparent)}
.overlay-inner{display:flex;justify-content:space-between;align-items:flex-end;width:100%;gap:1rem}
.overlay h2{font:300 clamp(2rem,3.4vw,3.2rem)/1.05 var(--serif);letter-spacing:.02em;margin:0;transition:transform .3s}
.tile:hover .overlay h2{transform:translateX(4px)}
.overlay small{display:block;font:400 10px var(--mono);letter-spacing:.2em;color:#9a9a9e;margin-top:.6rem;text-transform:uppercase}
.arrow{font:400 .8rem var(--mono);color:#9a9a9e;transition:color .3s}
.tile:hover .arrow{color:#fff}

footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.5rem;padding:1rem clamp(1rem,2.5vw,2.5rem);border-top:1px solid var(--line);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#6b6b6f}

/* panel */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:clamp(.75rem,3vw,2.5rem);background:rgba(0,0,0,.85);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);opacity:0;transition:opacity .3s}
.modal[hidden]{display:none}
.modal.show{opacity:1}
.sheet{width:100%;max-width:64rem;height:88vh;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line2);border-radius:16px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6);transform:scale(.96);transition:transform .3s cubic-bezier(.16,1,.3,1)}
.modal.show .sheet{transform:none}
.sheet-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:1rem;padding:clamp(1.25rem,3vw,2rem);border-bottom:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.4)}
.meta{display:flex;align-items:center;gap:.7rem;margin-bottom:.5rem;font:400 10px var(--mono);letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.badge{color:#fff;background:rgba(255,255,255,.1);padding:.25rem .6rem;border-radius:4px;letter-spacing:.3em}
.sheet-head h3{font:300 clamp(2rem,4.5vw,3.2rem)/1 var(--serif);margin:0;letter-spacing:.02em}
.close{font:400 11px var(--mono);letter-spacing:.15em;color:var(--muted);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:.65rem 1rem}
.close:hover{color:#fff;border-color:rgba(255,255,255,.3)}
.controls{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.75rem;padding:.75rem clamp(1.25rem,3vw,2rem);border-bottom:1px solid var(--line);background:rgba(24,24,24,.5)}
.filters{display:flex;gap:.35rem;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;font:500 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:.4rem .75rem;border-radius:4px}
.filters button:hover{color:#fff}
.filters button[aria-pressed="true"]{color:#fff;background:rgba(255,255,255,.1)}
.right{display:flex;gap:.75rem;align-items:center;flex:1 1 16rem;justify-content:flex-end}
.north{font:500 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid rgba(255,255,255,.1);border-radius:4px;padding:.4rem .75rem;white-space:nowrap}
.north[aria-pressed="true"]{color:#000;background:#fff;border-color:#fff}
.search{flex:1;max-width:16rem;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:.45rem .75rem;font:300 12px var(--sans);color:#fff;outline:0;min-width:0}
.search:focus{border-color:rgba(255,255,255,.3)}
.search::placeholder{color:#6b6b6f}
.list{flex:1;overflow-y:auto;padding:clamp(1.25rem,3vw,2rem)}
.list::-webkit-scrollbar{width:4px}.list::-webkit-scrollbar-thumb{background:#282828;border-radius:2px}
.group{margin-bottom:2rem}
.group h4{font:400 10px var(--mono);letter-spacing:.25em;text-transform:uppercase;color:#6b6b6f;margin:0 0 .75rem}
.res{display:flex;justify-content:space-between;align-items:center;gap:1rem;background:var(--panel);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:1rem 1.25rem;margin-bottom:.6rem;transition:border-color .3s}
.res:hover{border-color:rgba(255,255,255,.3)}
.res-tags{display:flex;gap:.4rem;margin-bottom:.35rem}
.res-tags span{font:400 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:.15rem .45rem;border-radius:4px;color:#fff;background:rgba(255,255,255,.1)}
.res-tags span.ghost{background:none;border:1px solid rgba(255,255,255,.1);color:var(--muted)}
.res-name{font:400 1.1rem/1.3 var(--sans);color:#fff;margin:0}
.res.missing .res-name{color:var(--dim)}
.actions{display:flex;gap:.5rem;flex:none}
.copy{border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:.55rem;color:var(--muted);display:grid;place-items:center}
.copy:hover{color:#fff;border-color:rgba(255,255,255,.3)}
.visit{background:#fff;color:#000;font:500 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;padding:.6rem 1rem;border-radius:8px;white-space:nowrap}
.visit:hover{background:#ddd}
.empty{padding:4rem 1rem;text-align:center;color:var(--muted)}
.sheet-foot{display:flex;justify-content:space-between;padding:.9rem 1.5rem;border-top:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.6);font:400 10px var(--mono);letter-spacing:.15em;text-transform:uppercase;color:#6b6b6f}
.toast{position:fixed;right:1.5rem;bottom:calc(1.5rem + env(safe-area-inset-bottom,0px));z-index:60;background:#fff;color:#000;font:500 12px var(--sans);padding:.75rem 1rem;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.4);transform:translateY(150%);opacity:0;transition:transform .3s cubic-bezier(.16,1,.3,1),opacity .3s}
.toast.show{transform:none;opacity:1}

@media (max-width:52rem){
  .tiles{grid-template-columns:1fr;height:auto;min-height:0}
  .tile{height:72vh;min-height:420px}
  .res{flex-direction:column;align-items:flex-start}
  .right{justify-content:flex-start}
  .search{max-width:none}
  .sheet{height:92vh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
/* ===== EDIT HERE =====
   images: list your own photos, e.g. ["images/film1.jpg","images/film2.jpg"] (one dot per photo).
           The Unsplash photos below are placeholders.
   tags:   which links.js tags each tile shows                                              */
const CONTACT_EMAIL = "";   // e.g. "rich@alumnus.tv"
const TILES = [
  {id:"film-tv-digital", title:"Film, TV, Digital", badge:"Film & broadcast", tags:["tv","film","photo","writing"],
   images:["https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=1200&q=85"], style:"grayscale(1) contrast(1.25) brightness(.9)"},
  {id:"journalism", title:"Journalism", badge:"Press & editorial", tags:["journo","sport"],
   images:["https://images.unsplash.com/photo-1509062522246-3755977927d7?auto=format&fit=crop&w=1200&q=85"], style:"brightness(.9) contrast(1.1)"},
  {id:"games-vfx", title:"Games & VFX", badge:"Interactive & 3D", tags:["games"],
   images:["https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?auto=format&fit=crop&w=1200&q=85"], style:"saturate(1.25) contrast(1.25)"}
];
const SLIDE_SECONDS = 5;
/* ===================== */

const TYPES=[["any","All"],["board","Job boards"],["scheme","Schemes"],["social","Groups"],["company","Companies"]];
const TYPE_NAMES={board:"Job board",scheme:"Scheme",social:"Group",company:"Careers"};
const SHOW_MISSING=SITE.SHOW_MISSING||new URLSearchParams(location.search).has("edit");
const data=LINKS.map(([g,n,u,t])=>({g,n,u,t:t.split(/\s+/)})).filter(l=>l.u||SHOW_MISSING);
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const linksFor=t=>data.filter(l=>l.t.includes("all")||t.tags.some(x=>l.t.includes(x)));
const reduced=matchMedia("(prefers-reduced-motion:reduce)").matches;

if(CONTACT_EMAIL)$("contactSlot").innerHTML=`<a href="mailto:${esc(CONTACT_EMAIL)}">Contact</a>`;

/* tiles */
$("tiles").innerHTML=TILES.map((t,i)=>`
  <a class="tile" href="#${t.id}" aria-label="${esc(t.title)}: ${linksFor(t).length} links">
    <div class="tile-bar">
      <div class="dots">${t.images.map((_,j)=>`<span class="dot${j===0?" on":""}"></span>`).join("")}</div>
      <span class="tile-label">${String(i+1).padStart(2,"0")} // Job directory</span>
    </div>
    <div class="view">
      ${t.images.map((src,j)=>`<img src="${esc(src)}" alt="" class="${j===0?"on":""}" style="filter:${t.style||"none"}" loading="${j===0?"eager":"lazy"}">`).join("")}
      <div class="overlay"><div class="overlay-inner">
        <div><h2>${esc(t.title)}</h2><small>${linksFor(t).length} links</small></div>
        <span class="arrow" aria-hidden="true">↗</span>
      </div></div>
    </div>
  </a>`).join("");

/* carousels */
document.querySelectorAll(".tile").forEach(tile=>{
  const imgs=[...tile.querySelectorAll("img")],dots=[...tile.querySelectorAll(".dot")];
  if(imgs.length<2||reduced)return;
  let i=0;
  setInterval(()=>{
    i=(i+1)%imgs.length;
    imgs.forEach((x,j)=>x.classList.toggle("on",j===i));
    dots.forEach((x,j)=>x.classList.toggle("on",j===i));
  },SLIDE_SECONDS*1000+Math.random()*800);
});

/* panel */
const st={tile:null,type:"any",north:false,q:""};
TYPES.forEach(([k,l])=>{const b=document.createElement("button");b.textContent=l;b.dataset.k=k;b.onclick=()=>{st.type=k;draw()};$("mFilters").appendChild(b)});
$("mSearch").oninput=e=>{st.q=e.target.value.trim().toLowerCase();draw()};
$("mNorth").onclick=()=>{st.north=!st.north;draw()};
$("mClose").onclick=()=>{history.pushState("",document.title,location.pathname+location.search);route()};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("modal").hidden)$("mClose").click()});
$("modal").addEventListener("click",e=>{if(e.target.id==="modal")$("mClose").click()});

function draw(){
  document.querySelectorAll("#mFilters button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===st.type));
  $("mNorth").setAttribute("aria-pressed",st.north);
  const all=linksFor(st.tile);
  const hits=all.filter(l=>(st.type==="any"||l.t.includes(st.type))&&(!st.north||l.t.includes("north"))&&(!st.q||(l.n+" "+l.g).toLowerCase().includes(st.q)));
  $("mCount").textContent=`${hits.length} of ${all.length} links`;
  if(!hits.length){$("mList").innerHTML=`<div class="empty">No links match. Try another filter or search.</div>`;return}
  const g=new Map();hits.forEach(l=>{if(!g.has(l.g))g.set(l.g,[]);g.get(l.g).push(l)});
  $("mList").innerHTML=[...g].map(([name,ls])=>`<section class="group"><h4>${esc(name)}</h4>${ls.map(l=>{
    const kind=TYPE_NAMES[l.t.find(x=>TYPE_NAMES[x])]||"";
    const tags=`<div class="res-tags">${kind?`<span>${kind}</span>`:""}${l.t.includes("north")?`<span class="ghost">North</span>`:""}</div>`;
    return l.u
      ?`<div class="res"><div>${tags}<p class="res-name">${esc(l.n)}</p></div><div class="actions">
          <button class="copy" data-url="${esc(l.u)}" aria-label="Copy link to ${esc(l.n)}"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg></button>
          <a class="visit" href="${esc(l.u)}" target="_blank" rel="noopener">Visit ↗</a></div></div>`
      :`<div class="res missing"><div>${tags}<p class="res-name">${esc(l.n)}</p></div><span class="tile-label">URL needed</span></div>`;
  }).join("")}</section>`).join("");
}
$("mList").addEventListener("click",async e=>{
  const b=e.target.closest(".copy");if(!b)return;
  try{await navigator.clipboard.writeText(b.dataset.url)}catch{const i=document.createElement("input");i.value=b.dataset.url;document.body.appendChild(i);i.select();document.execCommand("copy");i.remove()}
  $("toast").classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>$("toast").classList.remove("show"),2200);
});

let lastFocus=null;
function route(){
  const t=TILES.find(x=>"#"+x.id===location.hash);
  const m=$("modal");
  if(t){
    Object.assign(st,{tile:t,type:"any",north:false,q:""});$("mSearch").value="";
    $("mTitle").textContent=t.title;$("mBadge").textContent=t.badge;
    document.title=t.title+" | ALUMNUS";
    draw();$("mList").scrollTop=0;
    if(m.hidden){lastFocus=document.activeElement;m.hidden=false;document.body.classList.add("locked");requestAnimationFrame(()=>m.classList.add("show"));$("mClose").focus()}
  }else if(!m.hidden){
    document.title="ALUMNUS | Media & Creative Job Directory";
    m.classList.remove("show");document.body.classList.remove("locked");
    setTimeout(()=>{m.hidden=true;lastFocus&&lastFocus.focus()},reduced?0:300);
  }
}
window.addEventListener("hashchange",route);route();
</script>
